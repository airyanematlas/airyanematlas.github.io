name: Build and deploy site
on:
  # Daily publishing (directive 2 Nov 2026): content is uploaded once a week with each item's own
  # date; the site rebuilds every morning and publishes items dated today or earlier (Pacific).
  # Pushes to main do not deploy; manual dispatch is available.
  schedule:
    - cron: '10 14 * * *'   # daily 14:10 UTC (6:10 am PST / 7:10 am PDT)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build (publishes only items dated today or earlier, Pacific time)
        run: python3 _src/build.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
