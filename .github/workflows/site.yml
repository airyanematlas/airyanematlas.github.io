name: Build and deploy site
on:
  # Weekly publishing (directive 24 Oct 2026): the site is rebuilt only on Sunday afternoon
  # (and by manual dispatch). Pushes to main no longer deploy; new items wait for Sunday.
  schedule:
    - cron: '10 23 * * 0'   # Sundays 23:10 UTC (4:10 pm PDT / 3:10 pm PST)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build (publishes only items dated today or earlier, Pacific time)
        run: python3 _src/build.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
